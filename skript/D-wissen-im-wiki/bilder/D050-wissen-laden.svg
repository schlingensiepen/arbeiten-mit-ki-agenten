nchor="middle">Agent</text><text x="400.0" y="113.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="middle">sichtet, schlägt vor</text><rect x="300" y="216" width="200" height="64" fill="#70AD47"/><text x="400.0" y="245.0" font-size="16" fill="#000000" font-weight="700" text-anchor="middle">Sie</text><text x="400.0" y="265.0" font-size="14" fill="#000000" font-weight="400" text-anchor="middle">wählen aus</text><rect x="610" y="24" width="226" height="272" fill="#E7E6E6"/><text x="723.0" y="50" font-size="16" fill="#000000" font-weight="700" text-anchor="middle">Projekt</text><rect x="630" y="64" width="186" height="64" fill="#FFC000"/><text x="723.0" y="102.0" font-size="15" fill="#000000" font-weight="700" text-anchor="middle">Entscheidung</text><rect x="630" y="140" width="186" height="64" fill="#FFC000"/><text x="723.0" y="178.0" font-size="15" fill="#000000" font-weight="700" text-anchor="middle">Kopie im Wiki</text><rect x="630" y="216" width="186" height="64" fill="#FFC000"/><text x="723.0" y="254.0" font-size="15" fill="#000000" font-weight="700" text-anchor="middle">Einträge in Registern</text><line x1="204" y1="96.0" x2="296" y2="96.0" stroke="#000000" stroke-width="3" marker-end="url(#s)"/><path d="M114.0 216V172H330V132" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#s)"/><line x1="380" y1="128" x2="380" y2="212" stroke="#000000" stroke-width="3" marker-end="url(#s)"/><text x="370" y="196" font-size="14" fill="#000000" font-weight="400" text-anchor="end">Vorschlag</text><line x1="420" y1="216" x2="420" y2="132" stroke="#000000" stroke-width="3" marker-end="url(#s)"/><text x="430" y="196" font-size="14" fill="#000000" font-weight="400" text-anchor="start">Auswahl</text><line x1="500" y1="96.0" x2="606" y2="96.0" stroke="#000000" stroke-width="3" marker-end="url(#s)"/><text x="555.0" y="84.0" font-size="14" fill="#000000" font-weight="400" text-anchor="middle">Übernahme</text><rect x="24" y="322" width="14" height="14" fill="#7